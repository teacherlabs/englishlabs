services:
  - type: web
    name: englishlabs
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: englishlabs-data
      mountPath: /var/data
      sizeGB: 1
