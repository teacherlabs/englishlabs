services:
  - type: web
    name: englishlabs
    runtime: node
    buildCommand: rm -rf node_modules && npm ci
    startCommand: npm run reset-grammar && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VITE_CHARACTER_STUDIO_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: SOCKET_ALLOWED_ORIGINS
        sync: false
    disk:
      name: englishlabs-data
      mountPath: /var/data
      sizeGB: 1
